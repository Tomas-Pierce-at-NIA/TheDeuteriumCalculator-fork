# Configuration file for fork of the Deuterium Calculator project to support DIA data


[Constants]
Deuterium_Mass_Difference = 1.00628
Mass_Of_Water = 18.01528
Mass_Of_Hydrogen = 1.007276
Minutes_To_Seconds = 60

# peptide mass constants should not currently be in use
