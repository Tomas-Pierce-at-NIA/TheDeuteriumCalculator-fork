[Parameters]

# Tell the software whether the data inputs are from DDA or DIA data
Aquisition = "DIA" 

[Parameters.Step1]

# All individual peaks with less than this intensity ignored (10000)
Noise_Limit = 10000

# Peaks with less difference than this value matched to sequence (10)
Ppm_Match_Tolerance = 10 

# Peaks with less difference than this value combined within each sliding window (1)
Sliding_Window_Ppm_Tolerance = 1

# width of sliding window in seconds, should be integer divisible by SLIDE_FRACTION (60)
Sliding_Window_Size = 30

# Fraction of the window that the window moves each each slide (3)
Slide_Fraction = 3

# window of retention times to search for given peptide (+-) (30)
Retention_Tolerance = 30 

# The experimentally determined back exchange rate. (1) 
Deuterium_Recovery_Rate = 1

# The fraction of D2O used in the experiment. (1)  
Deuterium_Fraction = 0.833

# This will be used in single condition experiments
Condition1 = "Free"

  
Condition2 = "Complex"


[Parameters.Step2]

# Use to calculate confidence interval for differential woods plot (0-1)
WOODS_PLOT_CONFIDENCE_HIGH = 0.99

# Use to calculate confidence interval for differential woods plot (0-1)  
WOODS_PLOT_CONFIDENCE_LOW = 0.98  

# Title on the woods' plot
WOODS_PLOT_TITLE = r"Differential Uptake Woods' Plot"

# Title on the fractional woods' plot
FRACTIONAL_WOODS_PLOT_TITLE = r"Differential Fractional Uptake Woods' Plot"

# Inches  (4)
WOODS_PLOT_HEIGHT = 4

# Inches  (5)
WOODS_PLOT_WIDTH = 5


RETENTION_SHIFT_SLOPE = 1


RETENTION_SHIFT_INTERCEPT = 0


